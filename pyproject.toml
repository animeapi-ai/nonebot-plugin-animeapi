[project]
name = "nonebot-plugin-animeapi"
version = "1.0.0"
description = "NoneBot2 anime image generation plugin for AnimeAPI: $0.003 per image, no subscription. 使用 AnimeAPI 生成动漫图片，每张 $0.003"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AnimeAPI", email = "contact@animeapi.ai" }]
keywords = ["nonebot", "nonebot2", "nonebot-plugin", "anime", "image-generation", "ai-art", "text-to-image", "animeapi"]
classifiers = [
    "Framework :: AsyncIO",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "nonebot2>=2.3.0",
    "nonebot-plugin-alconna>=0.50.0",
    "httpx>=0.24.0",
    "pydantic>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/animeapi-ai/nonebot-plugin-animeapi"
Documentation = "https://animeapi.ai/docs"
Repository = "https://github.com/animeapi-ai/nonebot-plugin-animeapi"
Issues = "https://github.com/animeapi-ai/nonebot-plugin-animeapi/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nonebot_plugin_animeapi"]

[tool.hatch.build.targets.sdist]
include = ["nonebot_plugin_animeapi", "README.md", "README.en.md", "README.ja.md", "LICENSE"]

[tool.nonebot]
plugins = ["nonebot_plugin_animeapi"]
