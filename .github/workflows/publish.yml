# Publishes this package to PyPI when a version tag (vX.Y.Z) is pushed.
#
# Authentication is PyPI trusted publishing: PyPI accepts the short-lived
# identity GitHub issues to this workflow, so no PyPI token is stored anywhere.
# Each release carries attestations linking it to this repository and commit.
#
# To release: set the new version, add it to CHANGELOG.md, commit, then
# `git tag vX.Y.Z && git push origin main vX.Y.Z`.

name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check the tag matches the built version
        run: |
          version="${GITHUB_REF_NAME#v}"
          ls dist
          ls dist/*-"$version".tar.gz dist/*-"$version"-*.whl

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
